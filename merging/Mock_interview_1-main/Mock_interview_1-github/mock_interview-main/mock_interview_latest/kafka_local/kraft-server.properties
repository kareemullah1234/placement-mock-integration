# Local single-node Kafka (KRaft) config for Windows/host-run development.
#
# Run from the repo root (so relative log.dirs stays inside this repo):
#   $env:KAFKA_HOME="C:\kafka_2.13-4.2.0"   # change if needed
#   & "$env:KAFKA_HOME\bin\windows\kafka-storage.bat" random-uuid
#   & "$env:KAFKA_HOME\bin\windows\kafka-storage.bat" format -t <UUID> -c ".\mock_interview_latest\kafka_local\kraft-server.properties"
#   & "$env:KAFKA_HOME\bin\windows\kafka-server-start.bat" ".\mock_interview_latest\kafka_local\kraft-server.properties"

############################# Server Basics #############################

process.roles=broker,controller
node.id=1

# Controller endpoint (single-node)
controller.quorum.bootstrap.servers=127.0.0.1:9093

############################# Socket Server Settings #############################

# Use IPv4 explicitly to avoid localhost/IPv6 issues.
listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093

inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

############################# Log Basics #############################

# Keep Kafka data inside the repo for easy cleanup.
log.dirs=./mock_interview_latest/kafka_local/kafka-data

num.partitions=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
