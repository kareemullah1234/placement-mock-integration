<!DOCTYPE html>
<html>
<head>
<title>Company Dashboard</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

h2{
    color:#333;
}

.post-btn{
    background:#2ecc71;
    color:white;
    padding:10px 15px;
    border:none;
    border-radius:5px;
    text-decoration:none;
}

.post-btn:hover{
    background:#27ae60;
}

.job-container{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
    margin-top:30px;
}

.job-card{
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.job-title{
    font-size:18px;
    font-weight:bold;
    color:#2c3e50;
}

.job-desc{
    margin-top:10px;
    color:#555;
}

.job-skills{
    margin-top:10px;
    font-size:14px;
}

.actions{
    margin-top:15px;
}

.btn{
    padding:6px 10px;
    border-radius:4px;
    text-decoration:none;
    font-size:14px;
    margin-right:5px;
}

.view{
    background:#3498db;
    color:white;
}

.edit{
    background:#f39c12;
    color:white;
}

.delete{
    background:#e74c3c;
    color:white;
}

.empty{
    text-align:center;
    margin-top:50px;
    color:gray;
}

</style>
</head>

<body>

<div class="header">
<h2>Company Dashboard</h2>

<a href="{% url 'create_job' %}" class="post-btn">+ Post New Job</a>
</div>

<div class="job-container">

{% for job in jobs %}

<div class="job-card">

<div class="job-title">{{ job.title }}</div>

<div class="job-desc">{{ job.description }}</div>

<div class="job-skills">
<b>Skills:</b> {{ job.required_skills }}
</div>

<div class="actions">

<a href="{% url 'job_applicants' job.id %}" class="btn view">Applicants</a>

<a href="/companies/edit-job/{{job.id}}/" class="btn edit">Edit</a>

<a href="/companies/delete-job/{{job.id}}/" class="btn delete">Delete</a>

</div>

</div>

{% empty %}

<p class="empty">No jobs posted yet.</p>

{% endfor %}

</div>

</body>
</html>
