<!DOCTYPE html>
<html>
<head>
<title>Company Profile</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.profile-container{
    background:white;
    padding:40px;
    width:450px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.profile-container h2{
    text-align:center;
    margin-bottom:25px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
}

input, textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

textarea{
    resize:none;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}

</style>

</head>

<body>

<div class="profile-container">

<h2>Company Profile</h2>

<form method="POST">
{% csrf_token %}

<label>Company Name</label>
<input type="text" name="company_name" value="{{company.company_name}}">

<label>Website</label>
<input type="text" name="website" value="{{company.website}}">

<label>Location</label>
<input type="text" name="location" value="{{company.location}}">

<label>Description</label>
<textarea name="description" rows="4">{{company.description}}</textarea>

<button type="submit">Save Profile</button>

</form>

</div>

</body>
</html>
