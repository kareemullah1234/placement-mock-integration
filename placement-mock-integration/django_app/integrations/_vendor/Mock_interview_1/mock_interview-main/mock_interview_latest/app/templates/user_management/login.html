{% extends 'base.html' %}

{% block title %}Login - Mock Interview Platform{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center gradient-bg">
   <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl card-shadow">
       <div class="text-center">
           <i class="fas fa-user-graduate text-4xl text-indigo-600 mb-4"></i>
           <h2 class="text-3xl font-bold text-gray-900">Sign In</h2>
           <p class="mt-2 text-gray-600">Access your mock interview platform</p>
       </div>
       
       <form method="post" class="mt-8 space-y-6">
           {% csrf_token %} 
           <div class="space-y-4">
               <div>
                   <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                   <input id="email" name="email" type="email" required 
                          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
               </div>
               
               <div>
                   <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                   <input id="password" name="password" type="password" required 
                          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
               </div>
           </div>
           
           <div>
               <button type="submit" 
                       class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-200">
                   <i class="fas fa-sign-in-alt mr-2"></i>
                   Sign In
               </button>
           </div>
           
           <div class="text-center">
               <a href="{% url 'register' %}" class="text-indigo-600 hover:text-indigo-500 text-sm">
                   Don't have an account? Register here
               </a>
           </div>
       </form>
   </div>
</div>
{% endblock %}
