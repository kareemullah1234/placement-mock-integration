{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">

<div class="container"></div>

<h2>Available Jobs</h2>

{% for job in jobs %}

<div style="border:1px solid #ccc;padding:15px;margin-bottom:10px">

    <h3>{{ job.title }}</h3>
    <p><b>Company: </b> {{ job.company.company_name }}</p>
    <p>{{ job.description }}</p>

    <p><b>Required Skills:</b> {{ job.required_skills }}</p>

    <a href="{% url 'apply_job' job.id %}">
        <button>Apply</button>
    </a>

</div>

{% empty %}

<p>No jobs matched your skills.</p>

{% endfor %}

</div>
