<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Company Portal{% endblock %} | Elite Placement</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            min-height: 100vh;
            color: white;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-link {
            transition: all 0.2s ease-in-out;
        }
        .nav-link:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa; /* blue-400 */
        }
        .nav-active {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border-left: 3px solid #3b82f6; /* blue-500 */
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="flex overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-64 glass-panel border-r border-slate-800/50 hidden md:flex flex-col h-screen">
        <div class="px-6 py-8 border-b border-slate-800/50">
            <h1 class="text-2xl font-black text-white tracking-tighter flex items-center gap-3">
                <i class="fas fa-building text-blue-500"></i>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">Portal</span>
            </h1>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="{% url 'companies:company_dashboard' %}" class="nav-link block px-4 py-3 rounded-xl text-slate-300 font-medium text-sm flex items-center gap-3 {% if request.resolver_match.url_name == 'company_dashboard' %}nav-active{% endif %}">
                <i class="fas fa-chart-line w-5"></i> Dashboard
            </a>
            <a href="{% url 'companies:job_list' %}" class="nav-link block px-4 py-3 rounded-xl text-slate-300 font-medium text-sm flex items-center gap-3 {% if request.resolver_match.url_name == 'job_list' %}nav-active{% endif %}">
                <i class="fas fa-search w-5"></i> Browse Jobs
            </a>
            <a href="{% url 'companies:create_job' %}" class="nav-link block px-4 py-3 rounded-xl text-slate-300 font-medium text-sm flex items-center gap-3 {% if request.resolver_match.url_name == 'create_job' %}nav-active{% endif %}">
                <i class="fas fa-plus-circle w-5"></i> Post a Job
            </a>
            <a href="{% url 'companies:company_profile' %}" class="nav-link block px-4 py-3 rounded-xl text-slate-300 font-medium text-sm flex items-center gap-3 {% if request.resolver_match.url_name == 'company_profile' %}nav-active{% endif %}">
                <i class="fas fa-id-card w-5"></i> Company Profile
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800/50">
            <a href="{% url 'logout' %}" class="block px-4 py-3 rounded-xl text-rose-400 hover:bg-rose-500/10 font-medium text-sm flex items-center gap-3 transition-colors">
                <i class="fas fa-sign-out-alt w-5"></i> Logout
            </a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Top header for mobile and general actions -->
        <header class="glass-panel border-b border-slate-800/50 px-6 py-4 flex justify-between items-center z-10">
            <div class="md:hidden flex items-center gap-4">
                <button class="text-slate-400 hover:text-white"><i class="fas fa-bars text-xl"></i></button>
                <h2 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-500">Portal</h2>
            </div>
            
            <div class="hidden md:block">
                <!-- Breadcrumbs or Page Title could go here -->
                <h2 class="text-lg font-semibold text-slate-200">{% block header_title %}Overview{% endblock %}</h2>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white shadow-lg">
                        {{ request.user.username|make_list|first|upper }}
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 relative">
            <!-- Decorative background elements -->
            <div class="absolute top-0 right-0 w-96 h-96 bg-blue-600/5 rounded-full blur-3xl -z-10 pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 w-96 h-96 bg-indigo-600/5 rounded-full blur-3xl -z-10 pointer-events-none"></div>
            
            <!-- Dynamic Content -->
            {% block content %}
            {% endblock %}
        </div>
    </main>

</body>
</html>
