{% extends 'companies/base.html' %}
{% load static %}

{% block title %}Company Profile - Company Portal{% endblock %}
{% block header_title %}Company Profile{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-8">
    <div class="glass-panel p-8 rounded-3xl border border-slate-700/50 relative overflow-hidden shadow-2xl">
        <div class="absolute left-0 top-0 w-full h-32 bg-gradient-to-r from-blue-600/20 to-purple-600/20"></div>
        
        <div class="relative z-10 text-center mb-8 pt-4">
            <div class="w-24 h-24 mx-auto bg-slate-800 rounded-full border-4 border-slate-900 shadow-xl flex items-center justify-center mb-4">
                <i class="fas fa-building text-3xl text-blue-500"></i>
            </div>
            <h2 class="text-3xl font-black text-white tracking-tight">Your Profile</h2>
            <p class="text-slate-400 mt-2 font-medium">Update your company details for public listings.</p>
        </div>

        <form method="POST" class="space-y-6 relative z-10">
            {% csrf_token %}
            
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-300">Company Name</label>
                <div class="relative">
                    <i class="fas fa-briefcase absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" name="company_name" value="{{company.company_name|default:''}}" required
                        class="w-full bg-slate-900/50 text-white rounded-xl pl-12 pr-4 py-3 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 outline-none transition-all">
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-300">Website URL</label>
                <div class="relative">
                    <i class="fas fa-globe absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="url" name="website" value="{{company.website|default:''}}" placeholder="https://www.example.com"
                        class="w-full bg-slate-900/50 text-white rounded-xl pl-12 pr-4 py-3 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 outline-none transition-all">
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-300">Company Description</label>
                <textarea name="description" rows="5" placeholder="Tell candidates about your company's mission and culture..."
                    class="w-full bg-slate-900/50 text-white rounded-xl px-4 py-3 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 outline-none transition-all resize-y">{{company.description|default:''}}</textarea>
            </div>

            <div class="pt-6">
                <button type="submit" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 flex flex-center items-center justify-center gap-2 transform hover:scale-[1.02] active:scale-95 transition-all">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
