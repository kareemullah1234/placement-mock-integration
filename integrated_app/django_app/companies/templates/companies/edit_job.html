<!DOCTYPE html>
<html>
<head>
<title>Edit Job</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:30px;
    width:450px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

label{
    font-weight:bold;
}

input, textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

textarea{
    resize:none;
}

button{
    width:100%;
    padding:12px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}

</style>
</head>

<body>

<div class="container">

<h2>Edit Job Post</h2>

<form method="POST">
{% csrf_token %}

<label>Job Title</label>
<input type="text" name="title" value="{{ job.title }}" required>

<label>Description</label>
<textarea name="description" rows="5">{{ job.description }}</textarea>

<label>Required Skills</label>
<input type="text" name="skills" value="{{ job.required_skills }}">

<button type="submit">Update Job</button>

</form>

</div>

</body>
</html>
