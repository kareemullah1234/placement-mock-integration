<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Placement Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #020617 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        .input-glow:focus {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.8);
        }
    </style>
</head>
<body class="relative overflow-y-auto flex items-start justify-center py-12 px-4 min-h-screen">
    <!-- Background Decor -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl animate-float"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl animate-float" style="animation-delay: -3s"></div>

    <div class="w-full max-w-md relative z-10 transition-all duration-500 ease-in-out">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-600/10 rounded-3xl border border-blue-500/20 mb-6 group">
                <i class="fas fa-rocket text-4xl text-blue-500 group-hover:scale-110 transition-transform duration-300"></i>
            </div>
            <h1 class="text-4xl font-extrabold text-white tracking-tight mb-2">Welcome Back</h1>
            <p class="text-slate-400 font-medium">Empowering your career journey together</p>
        </div>

        <div class="glass-card rounded-3xl p-8 sm:p-10">
            {% if error %}
            <div class="bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 rounded-xl text-sm mb-6 flex items-center">
                <i class="fas fa-exclamation-circle mr-3"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Username</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-user-circle text-slate-500 group-focus-within:text-blue-500 transition-colors"></i>
                        </div>
                        <input type="text" name="username" required 
                            class="block w-full pl-11 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-2xl text-white placeholder-slate-500 input-glow transition-all duration-200 outline-none" 
                            placeholder="jondoe23">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Password</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-slate-500 group-focus-within:text-blue-500 transition-colors"></i>
                        </div>
                        <input type="password" name="password" required 
                            class="block w-full pl-11 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-2xl text-white placeholder-slate-500 input-glow transition-all duration-200 outline-none" 
                            placeholder="••••••••">
                    </div>
                    <div class="flex justify-end mt-2">
                        <a href="#" class="text-xs font-medium text-slate-400 hover:text-blue-400 transition-colors">Forgot Password?</a>
                    </div>
                </div>

                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 bg-slate-900 border-slate-700 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-slate-400">Remember me</label>
                </div>

                <button type="submit" 
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-4 rounded-2xl shadow-lg border border-blue-400/20 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 uppercase tracking-widest text-sm">
                    Access Portal
                </button>
            </form>

            <div class="mt-10 pt-8 border-t border-slate-700/50 text-center">
                <p class="text-slate-400 text-sm">
                    New to the platform? 
                    <a href="{% url 'register' %}" class="text-blue-500 hover:text-blue-400 font-bold transition-colors ml-1">Create Account</a>
                </p>
            </div>
        </div>
        
        <p class="mt-12 text-center text-slate-500 text-xs font-medium tracking-wide">
            &copy; 2026 Placement Portal • Secure Enterprise Access
        </p>
    </div>
</body>
</html>
