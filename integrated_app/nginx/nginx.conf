upstream django {
    server web:8000;
}

upstream audio_api {
    server audio_api:5000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;    # large audio/video uploads

    # ── Static files served directly by nginx ──────────────────────────
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Flask audio analysis API ────────────────────────────────────────
    # All /api/audio/* requests go to Flask
    location /api/audio/ {
        proxy_pass http://audio_api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;           # AI analysis can take time
        proxy_connect_timeout 10s;
    }

    # ── Everything else goes to Django ──────────────────────────────────
    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # WebSocket support (for future real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
